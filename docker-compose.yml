services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plan-proof-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@target:5432/app_db
      TARGET_DATABASE_URL: postgresql://${TARGET_READER_USER:-plan_proof_reader}:${TARGET_READER_PASSWORD:?Set TARGET_READER_PASSWORD in .env}@target:5432/target_db
      SANDBOX_DATABASE_URL: postgresql://${SANDBOX_USER:-sandbox_admin}:${SANDBOX_PASSWORD:?Set SANDBOX_PASSWORD in .env}@sandbox:5432/sandbox_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      target:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - plan-proof

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plan-proof-web
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - plan-proof

  target:
    image: postgres:16.15
    container_name: plan-proof-target
    environment:
      POSTGRES_USER: target_admin
      POSTGRES_PASSWORD: ${TARGET_ADMIN_PASSWORD:?Set TARGET_ADMIN_PASSWORD in .env}
      POSTGRES_DB: target_db
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      TARGET_READER_USER: ${TARGET_READER_USER:-plan_proof_reader}
      TARGET_READER_PASSWORD: ${TARGET_READER_PASSWORD:?Set TARGET_READER_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "5433:5432"
    volumes:
      - target_data:/var/lib/postgresql/data
      - ./docker/target/init-roles.sh:/docker-entrypoint-initdb.d/00-init-roles.sh:ro
      - ./docker/target/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U target_admin -d target_db
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - plan-proof

  sandbox:
    build:
      context: ./docker/sandbox
      dockerfile: Dockerfile
    container_name: plan-proof-sandbox
    environment:
      POSTGRES_USER: ${SANDBOX_USER:-sandbox_admin}
      POSTGRES_PASSWORD: ${SANDBOX_PASSWORD:?Set SANDBOX_PASSWORD in .env}
      POSTGRES_DB: sandbox_db
    ports:
      - "5434:5432"
    volumes:
      - sandbox_data:/var/lib/postgresql/data
      - ./docker/sandbox/init.sql:/docker-entrypoint-initdb.d/00-hypopg.sql:ro
      - ./docker/benchmark/schema.sql:/docker-entrypoint-initdb.d/10-benchmark-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${SANDBOX_USER:-sandbox_admin} -d sandbox_db
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - plan-proof

  redis:
    image: redis:7
    container_name: plan-proof-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - plan-proof

volumes:
  target_data:
  sandbox_data:
  redis_data:

networks:
  plan-proof:
    driver: bridge
