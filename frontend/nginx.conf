server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve Compose service names when a request arrives. Resolving `app`
  # while Nginx starts can fail during container startup/recreation.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream app:8000;

  location /api/ {
    proxy_pass http://$api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /health {
    proxy_pass http://$api_upstream/health;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
